# =====================================================================
# Nginx config cho Flash Sale B2C
# =====================================================================
# Vai trò:
#   1. Reverse proxy chính — truy cập qua http://<VPS_IP>
#   2. Proxy /api/*        → backend:8080 (Spring Boot)
#   3. Proxy /ws           → backend:8080 (WebSocket STOMP + SockJS)
#   4. Proxy /actuator     → backend:8080 (health check)
#   5. Proxy /swagger-ui, /v3/api-docs → backend:8080
#   6. SPA fallback: tất cả route khác → Next.js container (port 3000)
#
# File này mount vào /etc/nginx/conf.d/default.conf trong container nginx.
# =====================================================================

# Map nginx server names → backend upstream (giữ tên service trong docker network)
upstream backend_api {
    server backend:8080;
}

upstream nextjs_app {
    server frontend:3000;
}

# WebSocket upgrade map (SockJS fallback)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # ── Tăng upload size cho ảnh upload ──────────────────────────────
    client_max_body_size 6M;

    # ── Gzip compression ─────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm;
    gzip_min_length 1024;

    # ── Backend API proxy (/api/*) ────────────────────────────────────
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── WebSocket proxy (/ws) ─────────────────────────────────────────
    # Spring Boot STOMP + SockJS endpoint.
    # URL: ws://<VPS_IP>/ws?token=<JWT>
    # SockJS fallback endpoints: /ws/info, /ws/<server-id>/<session-id>/websocket, ...
    location /ws {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket cần timeout dài
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── Swagger UI ────────────────────────────────────────────────────
    location /swagger-ui/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    location /v3/api-docs {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
    }

    # ── Actuator health ───────────────────────────────────────────────
    # Spring Boot Actuator expose ở /actuator/* (health, info, metrics).
    location /actuator/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback (tất cả route khác) → Next.js container ──────────
    # Next.js Router xử lý client-side routing.
    location / {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js có thể stream response (RSC, streaming SSR).
        # Tắt buffering để tránh delay.
        proxy_buffering     off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # ── Next.js static assets (cache 30 ngày) ────────────────────────
    location /_next/static/ {
        proxy_pass http://nextjs_app;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Error pages ───────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}