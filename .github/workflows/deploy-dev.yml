name: Deploy to VPS (dev = main)

on:
  repository_dispatch:
    types: [backend-deploy, frontend-deploy]
  push:
    branches: [main]

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail

            echo "=== [1/6] Pull backend repo ==="
            cd /opt/flash-sale/flash-sale-b2c-UTC2
            git fetch origin dev
            git reset --hard origin/dev
            git log --oneline -1

            echo "=== [2/6] Pull frontend repo ==="
            cd /opt/flash-sale/flash-sale-b2c-fe
            git fetch origin dev
            git reset --hard origin/dev
            git log --oneline -1

            echo "=== [3/6] Pull deploy repo (compose + nginx + scripts) ==="
            cd /opt/flash-sale/deploy-b2c-utc2
            git fetch origin main
            git reset --hard origin/main
            git log --oneline -1

            echo "=== [4/6] Build backend image ==="
            cd /opt/flash-sale/flash-sale-b2c-UTC2
            docker build \
              -t flash-sale-b2c-backend:latest \
              -f /opt/flash-sale/deploy-b2c-utc2/docker/backend.Dockerfile \
              .

            echo "=== [5/6] Build frontend image ==="
            cd /opt/flash-sale/flash-sale-b2c-fe
            docker build \
              -t flash-sale-b2c-frontend:latest \
              --build-arg NEXT_PUBLIC_API_URL=/api/v1 \
              --build-arg NEXT_PUBLIC_WS_URL= \
              --build-arg NEXT_PUBLIC_USE_MOCK=false \
              --build-arg NEXT_PUBLIC_SITE_URL=http://180.93.137.28 \
              --build-arg NEXT_PUBLIC_DEFAULT_LOCALE=vi \
              -f /opt/flash-sale/deploy-b2c-utc2/docker/frontend.Dockerfile \
              .

            echo "=== [6/6] Recreate backend + frontend containers ==="
            cd /opt/flash-sale/deploy-b2c-utc2
            docker compose up -d --no-deps backend frontend

            echo "=== [6b/6] Restart nginx to reload config (nginx/default.conf) ==="
            # nginx/default.conf is bind-mounted from host. After `git pull`,
            # the new file is on disk but the running nginx container still
            # uses the old config in memory. `docker compose pull` does not
            # recreate nginx (it uses upstream image nginx:1.27-alpine, not
            # a local build), so we must restart it explicitly.
            docker compose restart nginx

            echo "=== [7/6] Health check ==="
            ./scripts/check-health.sh

            echo "=== DONE ==="
            docker compose ps
