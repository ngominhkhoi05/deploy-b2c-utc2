# =====================================================================
# Flash Sale B2C - Docker Compose (Production)
# =====================================================================
# Mục đích: Chạy toàn bộ stack (Redis + Backend + Frontend Nginx) trên VPS.
#
# Cách dùng (trên VPS):
#   docker compose up -d              # khởi động
#   docker compose down               # tắt
#   docker compose logs -f backend    # xem log
#   docker compose restart backend    # restart 1 service
#
# Yêu cầu:
#   - File .env (chứa toàn bộ biến môi trường)
#   - Image backend đã build: flash-sale-b2c-backend:latest
#   - Image frontend đã build: flash-sale-b2c-frontend:latest
# =====================================================================

services:

  # ── REDIS ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: flash-sale-b2c-redis
    restart: unless-stopped
    env_file:
      # CHỈ đọc redis.env (chứa REDIS_PASSWORD) — KHÔNG đọc .env chung
      # để tránh lộ DB password / JWT secret vào container Redis.
      - redis.env
    # Dùng ${VAR:+...} để chỉ thêm --requirepass khi REDIS_PASSWORD khác rỗng.
    # ⚠️ Cần escape thành $${...} vì Docker Compose tự interpolate ${...}
    #    trước khi container khởi động — không escape thì biến bị thay rỗng.
    # ⚠️ KHÔNG dùng escaped quotes (\") ở đây: Compose sẽ strip chúng, khiến
    #    "redis-server --requirepass $REDIS_PASSWORD" mất dấu nháy và Redis báo
    #    "wrong number of arguments" khi password rỗng.
    command: >-
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
        exec redis-server --requirepass "$$REDIS_PASSWORD"
        --maxmemory 256mb --maxmemory-policy allkeys-lru;
      else
        exec redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru;
      fi'
    volumes:
      # Persistent data Redis — tồn tại qua các lần `docker compose down`
      - redis-data:/data
    healthcheck:
      # ⚠️ Phải truyền password khi Redis chạy --requirepass.
      # redis-cli ping KHÔNG có auth sẽ trả về "NOAUTH Authentication
      # required." (nhưng vẫn exit 0), nên `grep -q PONG` fail →
      # container bị đánh dấu unhealthy → backend không khởi động được
      # (depends_on: condition: service_healthy).
      # REDIS_PASSWORD lấy từ redis.env (đã có trong env_file ở trên).
      test:
        - CMD-SHELL
        - >-
          redis-cli
          $${REDIS_PASSWORD:+-a "$$REDIS_PASSWORD" --no-auth-warning}
          ping
          | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - flash-sale-net

  # ── BACKEND (Spring Boot) ─────────────────────────────────────────────
  backend:
    image: flash-sale-b2c-backend:latest
    container_name: flash-sale-b2c-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override dùng internal Docker DNS name cho Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # DB_HOST giữ nguyên trong .env (Supabase Cloud)
      TZ: Asia/Ho_Chi_Minh
      # JAVA_OPTS đã có sẵn trong .env.example. Nếu .env thiếu, dùng default.
      JAVA_OPTS: ${JAVA_OPTS:--Xmx1024m -Xms512m -XX:+UseG1GC}
    ports:
      # Bind localhost:8080, KHÔNG public ra ngoài.
      # Nginx sẽ proxy /api → backend:8080.
      - "127.0.0.1:8080:8080"
    healthcheck:
      # ⚠️ Dùng curl, KHÔNG dùng wget: image eclipse-temurin JRE không có
      #    sẵn wget (lỗi: "/bin/sh: 1: wget: not found" → mọi lần check fail
      #    → container unhealthy → nginx không khởi động).
      #    curl đã được cài trong docker/backend.Dockerfile.
      #
      # ⚠️ Phải kiểm tra status == 200, không chỉ "curl thành công":
      #    curl -f trả exit 0 với cả 401/403 (đã test) — chỉ fail từ 400 trở lên.
      #    Nếu SecurityConfig chưa permitAll /actuator/health thì 401 vẫn pass
      #    → healthcheck báo healthy dù app thực tế chưa sẵn sàng.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health | grep -qx 200 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # App cần thời gian: JVM boot + Flyway migration + kết nối Supabase.
      # Tổng thời gian chờ = start_period + (retries × interval) = 150 + 75s.
      start_period: 150s
    networks:
      - flash-sale-net

  # ── FRONTEND (Nginx reverse proxy + Next.js app) ─────────────────────
  # Container Nginx serve user request + proxy /api, /ws → backend.
  nginx:
    image: nginx:1.27-alpine
    container_name: flash-sale-b2c-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      # Port 80 - truy cập http://<VPS_IP>
      - "80:80"
    volumes:
      # Relative path so compose chạy được trên cả Windows (dev/test)
      # lẫn Linux VPS (prod). Trên VPS chạy `cd /opt/deploy-b2c-utc2`
      # trước khi `docker compose up -d`.
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - flash-sale-net

  frontend:
    image: flash-sale-b2c-frontend:latest
    container_name: flash-sale-b2c-frontend
    restart: unless-stopped
    expose:
      # Chỉ expose cho Nginx proxy, KHÔNG public ra ngoài.
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - flash-sale-net

# ── VOLUMES ─────────────────────────────────────────────────────────────
volumes:
  redis-data:
    name: flash-sale-b2c-redis-data

# ── NETWORKS ────────────────────────────────────────────────────────────
networks:
  flash-sale-net:
    name: flash-sale-net
    driver: bridge