# =====================================================================
# Nginx config cho Flash Sale B2C
# =====================================================================
# Vai trò:
#   1. Reverse proxy chính — truy cập qua http://<VPS_IP>
#   2. Proxy /api/*        → backend:8080 (Spring Boot)
#   3. Proxy /ws           → backend:8080 (WebSocket STOMP + SockJS)
#   4. Proxy /actuator     → backend:8080 (health check)
#   5. Proxy /swagger-ui, /v3/api-docs → backend:8080
#   6. SPA fallback: tất cả route khác → Next.js container (port 3000)
#
# File này mount vào /etc/nginx/conf.d/default.conf trong container nginx.
# =====================================================================

# Docker embedded DNS (127.0.0.11) + resolver ở cấp http block.
# Lý do: khi container `frontend` hoặc `backend` restart, IP trong Docker network
# thay đổi. Nếu không có resolver, nginx cache IP cũ vĩnh viễn → request gửi
# đến IP không còn tồn tại → 502 Bad Gateway → phải `nginx -s reload` thủ công.
# `resolver` ở đây bắt buộc để dùng được từ khóa `resolve` trong upstream.
resolver 127.0.0.11 ipv6=off valid=10s;

# Map nginx server names → backend upstream (giữ tên service trong docker network)
# `resolve` yêu cầu nginx DNS lookup mỗi request (theo TTL của resolver ở trên).
# Kết quả: nginx tự pick IP mới trong vòng 10s khi container restart, không cần reload.
upstream backend_api {
    # 'zone' bắt buộc khi dùng 'resolve' (Nginx 1.25+ yêu cầu shared memory
    # cho upstream resolve runtime, không có zone sẽ fail validate với
    # "resolving names at run time requires upstream ... to be in shared memory").
    zone backend_api 64k;
    server backend:8080 resolve;
}

upstream nextjs_app {
    zone nextjs_app 64k;
    server frontend:3000 resolve;
}

# WebSocket upgrade map (SockJS fallback)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # ── Tăng upload size cho ảnh upload ──────────────────────────────
    client_max_body_size 6M;

    # ── Gzip compression ─────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm;
    gzip_min_length 1024;


    # ── ZaloPay callback (special: timeout dài cho DB transaction) ──────
    # Đặt TRƯỚC location /api/ để match chính xác. ZaloPay retry tối đa
    # 3 lần nếu timeout/5xx — backend đã idempotent nhưng timeout dài giúp
    # tránh retry không cần thiết. POST /api/v1/payments/zalopay/callback
    # là PUBLIC (SecurityConfig permitAll), verify bằng HMAC-SHA256.
    location = /api/v1/payments/zalopay/callback {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backend có thể cần 5-30s nếu Supabase chậm (update payment + order
        # + broadcast WS), nên đặt 120s cho an toàn.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    # ── Backend API proxy (/api/*) ────────────────────────────────────
    # CORS Preflight (OPTIONS) + X-Forwarded-Host cho OAuth2 (Spring Security
    # cần header này để xác thực Hostname gốc từ trình duyệt khi đi qua proxy).
    # Flow Google OAuth: trình duyệt redirect từ Google về FE (cross-origin) →
    # FE gọi POST /api/v1/auth/google → trình duyệt tự gửi OPTIONS preflight
    # trước. Nếu block /api/ không xử lý OPTIONS, request POST bị trình duyệt
    # chặn đứng (request không bao giờ chạm tới backend → log Spring Boot trống).
    location /api/ {
        # ── CORS ─────────────────────────────────────────────────────
        # KHONG add_header Access-Control-Allow-* o day.
        # Ly do: Spring Security CORS filter (corsConfigurationSource bean)
        # da add header cho moi response. Neu Nginx cung add → duplicate
        # header → browser reject theo spec CORS (Fetch Standard).
        # Source of truth: src/main/java/.../config/CorsConfig.java (BE repo)
        # Fix 2026-10-18: xoá toàn bộ add_header CORS để tránh duplicate.

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bắt buộc cho Spring Security OAuth2: backend cần Hostname gốc từ
        # trình duyệt để verify redirect_uri (vd http://localhost:3000/auth/callback).
        # Nếu thiếu, defaultRedirectUri của OAuth2LoginAuthenticationFilter
        # sẽ lấy nhầm `backend:8080` thay vì origin FE → 401.
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── WebSocket proxy (/ws) ─────────────────────────────────────────
    # Spring Boot STOMP + SockJS endpoint.
    # URL: ws://<VPS_IP>/ws?token=<JWT>
    # SockJS fallback endpoints: /ws/info, /ws/<server-id>/<session-id>/websocket, ...
    location /ws {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket cần timeout dài
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── Swagger UI ────────────────────────────────────────────────────
    location /swagger-ui/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    location /v3/api-docs {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
    }

    # ── Actuator health ───────────────────────────────────────────────
    # Spring Boot Actuator expose ở /actuator/* (health, info, metrics).
    location /actuator/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback (tất cả route khác) → Next.js container ──────────
    # Next.js Router xử lý client-side routing.
    location / {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js có thể stream response (RSC, streaming SSR).
        # Tắt buffering để tránh delay.
        proxy_buffering     off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # ── Next.js static assets (cache 30 ngày) ────────────────────────
    location /_next/static/ {
        proxy_pass http://nextjs_app;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Error pages ───────────────────────────────────────────────────
    # TẠM TẮT error_page để Nginx pass response từ BE nguyên vẹn (JSON
    # + status code gốc). Lý do: GlobalExceptionHandler của BE đã trả JSON
    # theo format {success, code, message, timestamp} cho mọi lỗi business
    # (AUTH_*, VALIDATION_*, ...) — nếu Nginx serve trang HTML tĩnh thì FE
    # không đọc được error code, dẫn đến UX kém (vd Google 401 từ OAuth
    # không hiện được message cụ thể cho user).
    #
    # Nếu sau này cần trang HTML đẹp cho 5xx upstream thì bật lại + thêm
    # `proxy_intercept_errors on;` cho location /api/ để Nginx chỉ chặn
    # error khi upstream thật sự chết (502/504), còn lỗi business 4xx
    # từ BE vẫn đi qua.
    # error_page 502 503 504 /50x.html;
    # location = /50x.html {
    #     root /usr/share/nginx/html;
    # }
}